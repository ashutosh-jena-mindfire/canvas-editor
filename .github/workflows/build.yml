name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 📦 Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🟢 Setup Node (latest)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      # 📥 Install dependencies
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 🧹 Lint (optional but recommended)
      - name: Run lint
        run: yarn lint --if-present

      # 🔍 Type check (TS projects)
      - name: Run typecheck
        run: yarn typecheck --if-present

      # 🧪 Tests (IMPORTANT)
      - name: Run tests
        run: yarn test --if-present

      # 🏗️ Build
      - name: Build project
        run: yarn build

      # 📁 Rename build folder
      - name: Prepare deployment folder
        run: mv dist canvas-editor

      # 🚀 Deploy via SCP
      - name: Copy files to server
        uses: garygrossgarten/github-action-scp@v2
        with:
          local: canvas-editor
          remote: ${{ secrets.PATH }}
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          rmRemote: true

      # ⚙️ Run remote command
      - name: Update index.html on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            sed -i 's#</body>#${{ secrets.SCRIPT }}</body>#g' ${{ secrets.PATH }}/index.html